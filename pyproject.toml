[project]
name = "nepal-climate-change-impact"
version = "0.1.0"
description = "Reproducible analysis environment for the Nepal climate change impact study"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "ipykernel>=6.29",
    "jupyter-core>=5.7",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14.6",
    "xgboost>=2.1",
]

[tool.uv]
package = false
